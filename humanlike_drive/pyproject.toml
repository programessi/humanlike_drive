[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "humanlike-drive"
version = "0.0.1"
description = "Unified wrist-hand steering research scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
scene = [
    "mujoco>=3.3.2,<4",
    "numpy>=1.24",
    "scipy>=1.10",
    "trimesh>=4",
    "Pillow>=9",
]
p0 = [
    "humanlike-drive[scene]",
    "matplotlib>=3.7",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["humanlike_drive*"]
namespaces = false

[tool.setuptools.package-data]
humanlike_drive = ["config/**/*.yaml", "config/**/*.yml", "config/**/*.json"]
