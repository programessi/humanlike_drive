# 4.2 task-scale trial: preserve learner/input/reward/exploration settings.
# Both amplitude and speed change; this is not an amplitude-only ablation.
design: configs/stage_a.yaml
environment_config: configs/m1.yaml
run_kind: M3_B_twenty_degree_single_direction_development_training
seed: 7
device: cpu
torch_threads: 1
total_steps: 51200
checkpoint_every_updates: 20
initialization:
  checkpoint: runs/m2_smoke_seed7_v1/initial.pt
  arm_std: 0.10
  hand_std: 0.50
environment_overrides:
  initial_support: both
  episode_seconds: 10.0
  reference:
    mode: hold
    speed_deg_s: 5.0
    hold_seconds: 1.0
tasks:
  mode: single_direction
  balanced_episode_counts: {hold: 4, positive: 3, negative: 3}
  amplitude_range_deg: [20.0, 20.0]
  speed_range_deg_s: [5.0, 5.0]
  final_hold_seconds: 3.0
  hold_episode_seconds: 10.0
ppo:
  num_envs: 4
  rollout_steps: 128
  recurrent_sequence_steps: 64
  minibatch_steps: 256
  update_epochs: 4
  entropy_coefficient: 0.001
evaluation:
  suite: single_direction
  amplitude_deg: [5.0, 10.0, 20.0]
  speed_deg_s: [5.0]
  hold_seconds: [3.0, 5.0, 7.0, 10.0]
  final_hold_seconds: 3.0
  rmse_gate_deg: 1.0
  endpoint_gate_deg: 1.0
  hold_peak_gate_deg: 1.0
  min_baseline_improvement: 0.30
  min_signed_progress_fraction: 0.50
monitoring:
  evaluation_every_steps: 10240
  retain_step_checkpoints: true
  diagnostics: false
tensorboard:
  enabled: true
  histogram_every_updates: 20
