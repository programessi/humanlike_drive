# Scripted fixture diagnostic. Loads below are simulation probes, not calibrated hardware ratings.
scene: assets/scene.xml
policy_hz: 20
settle_seconds: 1.5
probe_seconds: 3.0
load_ramp_seconds: 0.5
probe_torques_nm: [0.0, 0.1, -0.1]
wheel_load:
  center_angle_deg: 0.0
  centering_stiffness_nm_per_rad: 0.3
  centering_torque_limit_nm: 1.0
  viscous_damping_nm_s_per_rad: 0.15
  coulomb_friction_nm: 0.03
initial_hand_open: [0.3, 0.1, 0.15, 0.15, 0.15, 0.15]
initial_hand_closed: [0.6, 0.42, 1.0, 1.0, 1.0, 1.0]
gates:
  max_wheel_drift_deg: 2.0
  min_arm_margin_deg: 2.0
  max_non_hand_collision_force_n: 1.0
  max_initial_ik_position_error_m: 0.002
