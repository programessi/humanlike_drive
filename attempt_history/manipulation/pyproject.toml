[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wheel-manipulation"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["mujoco>=3.3,<4", "gymnasium>=1.0,<2", "numpy>=1.24", "scipy>=1.10", "torch>=2.2", "stable-baselines3>=2.6,<3", "imageio>=2.30", "imageio-ffmpeg>=0.5", "matplotlib>=3.7", "PyYAML>=6", "Pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["wheel_manipulation*"]
